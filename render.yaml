services:
  # Servicio Web Flask en Render
  - type: web
    name: germania-web
    runtime: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt && python init_db.py"
    startCommand: "gunicorn wsgi:app --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: germania-db
          property: connectionString

databases:
  # Base de Datos PostgreSQL Gestionada directamente en Render
  - name: germania-db
    databaseName: colegio_rural
    user: germania_admin
    region: ohio
    plan: free
