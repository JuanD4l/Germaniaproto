services:
  # ================================================================
  # Servicio Web Flask en Render (Plan Free: 750h/mes, sin costo)
  # ================================================================
  - type: web
    name: germania-web
    runtime: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt && python init_db.py"
    startCommand: "gunicorn wsgi:app --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # DATABASE_URL: Se conecta a la base de datos PostgreSQL gratuita de Neon.tech
      # Formato: postgresql://usuario:clave@host/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
