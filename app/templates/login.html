{% extends "base.html" %}

{% block title %}Iniciar Sesión - Germania{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <div class="bg-gradient-to-r from-brand-900 to-brand-800 p-6 text-white text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-white/10 mb-2 border border-white/20">
        <i class="fa-solid fa-lock text-xl text-brand-100"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight">Acceso Institucional Germania</h2>
      <p class="text-xs text-brand-100 mt-1">Control de Asistencia y Prevención de Deserción Escolar</p>
    </div>

    <form method="POST" action="{{ url_for('web.login') }}" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Tipo y Documento / Correo</label>
        <div class="grid grid-cols-3 gap-2">
          <select name="tipo_documento" id="tipo_documento" class="border border-slate-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="CC" selected>CC</option>
            <option value="TI">TI</option>
            <option value="CE">CE</option>
          </select>
          <input type="text" name="identificador" id="identificador" required placeholder="Ej: 2001"
                 class="col-span-2 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none font-medium">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
        <input type="password" name="contrasena" id="contrasena" required value="Germania2026*"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
      </div>

      <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-bold text-sm shadow-md transition">
        <i class="fa-solid fa-arrow-right-to-bracket mr-1.5"></i> Ingresar al Sistema
      </button>

      <!-- Botones de Demostración Rápida -->
      <div class="pt-4 border-t border-slate-200">
        <span class="block text-xs font-bold text-slate-500 uppercase tracking-wider text-center mb-2">Acceso Rápido de Prueba (Demo)</span>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="cargarCredenciales('CC', '2001')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded text-xs font-semibold text-slate-700 text-center transition">
            👑 Rector
          </button>
          <button type="button" onclick="cargarCredenciales('CC', '4001')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded text-xs font-semibold text-slate-700 text-center transition">
            👨‍🏫 Docente
          </button>
          <button type="button" onclick="cargarCredenciales('CC', '3001')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded text-xs font-semibold text-slate-700 text-center transition">
            📋 Secretaría
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  function cargarCredenciales(tipo, doc) {
    document.getElementById('tipo_documento').value = tipo;
    document.getElementById('identificador').value = doc;
    document.getElementById('contrasena').value = 'Germania2026*';
  }
</script>
{% endblock %}
